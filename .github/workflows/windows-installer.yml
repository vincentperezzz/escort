name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  setup-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python packaging tools
        run: python -m pip install -e ".[windows]" pyinstaller pywebview pystray keyring
      - name: Build the desktop UI
        working-directory: desktop/ui
        run: npm ci && npm run build
      - name: Bundle Escort.exe
        run: pyinstaller packaging/escort.spec --noconfirm --distpath dist --workpath build/pyinstaller
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile EscortSetup.exe
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\escort.iss'
      - name: Smoke test Escort.exe launch
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\Escort\Escort.exe'
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            throw "Escort.exe exited early with code $($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: Upload CI artifact
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: EscortSetup
          path: packaging/Output/EscortSetup.exe
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/Output/EscortSetup.exe
          generate_release_notes: false
          body: |
            Windows installer for Escort (unsigned).

            SmartScreen may block the download. Choose **More info**, then **Run anyway**, if you trust this build.

            Uninstall from **Add or Remove Programs** after setup.
