name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  setup-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python packaging tools
        run: python -m pip install -e ".[windows]" pyinstaller pywebview pystray keyring
      - name: Build the desktop UI
        working-directory: desktop/ui
        run: npm ci && npm run build
      - name: Package the Electron overlay
        working-directory: overlay
        run: npm ci && npm run package
      - name: Bundle Escort.exe
        run: pyinstaller packaging/escort.spec --noconfirm --distpath dist --workpath build/pyinstaller
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile EscortSetup.exe
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\escort.iss'
      - name: Smoke test Escort.exe launch
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\Escort\Escort.exe'
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $p = Start-Process -FilePath $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            if ($p.HasExited) { throw "Escort.exe exited early with code $($p.ExitCode)" }
            try { $ok = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8750/api/status -TimeoutSec 2).StatusCode -eq 200 } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "Escort.exe never served /api/status (startup crash dialog?)" }
      - name: Upload CI artifact
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: EscortSetup
          path: packaging/Output/EscortSetup.exe
          if-no-files-found: error
