[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taglish-listener"
version = "0.1.0"
description = "Headless Taglish meeting listener. Scope-creep cards over MCP, with a side panel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.20",
  "httpx>=0.27",
  "pillow>=10",
  "websockets>=12",
  "mss>=9",
]

[project.optional-dependencies]
windows = ["PyAudioWPatch"]
whisper = ["faster-whisper"]
dev = ["pytest>=8"]

[project.scripts]
taglish-listener = "taglish_listener.cli:main"

[tool.setuptools.packages.find]
include = ["taglish_listener*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
